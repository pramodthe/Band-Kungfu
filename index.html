<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <link rel="icon" href="data:," />
    <title>Band Kungfu — The Grand Arena</title>
    <script type="importmap">
      { "imports": { "three": "./vendor/three/three.module.js", "three/addons/": "./vendor/three/addons/" } }
    </script>
    <link rel="stylesheet" href="./src/ui/styles.css" />
  </head>
  <body class="inkhold">
    <canvas id="c"></canvas>
    <div id="hud" hidden></div>
    <div id="menu" hidden>
      <div class="t">
        Arick
        <i>Fighter</i>
      </div>
      <div class="en" style="--d: 0.04s">BAND KUNGFU</div>
      <div class="sub" style="--d: 0.08s">Paused</div>
      <button id="go" style="--d: 0.14s">Resume</button>
      <button id="quit" style="--d: 0.18s">
        Quit
        <small>Back to the title</small>
      </button>
      <div class="hint" style="--d: 0.22s">
        <kbd>↑</kbd>
        <kbd>↓</kbd>
        Select ·
        <kbd>Enter</kbd>
        <kbd class="pad">A</kbd>
        Confirm ·
        <kbd>Esc</kbd>
        <kbd class="pad">B</kbd>
        Resume
      </div>
    </div>
    <!-- flow screens (main.js) -->
    <div id="title" class="scr" hidden></div>
    <div id="select" class="scr" hidden></div>
    <div id="loading" class="scr" hidden></div>
    <div id="result" class="scr" hidden></div>
    <div id="ink" class="boot">
      <div class="ink-wait">
        <svg viewBox="0 0 100 100">
          <circle cx="50" cy="50" r="45" stroke-width="3" stroke-dasharray="120 163" />
          <circle
            cx="50"
            cy="50"
            r="40"
            stroke-width="1.4"
            stroke-dasharray="36 215"
            stroke-dashoffset="-150"
            opacity=".6"
          />
        </svg>
        <i>LOADING</i>
      </div>
    </div>
    <script src="./src/ui/boot.js"></script>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
